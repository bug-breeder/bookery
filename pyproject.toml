[project]
name = "bookery"
version = "0.1.0"
description = "Fidelity-checked pipeline that turns a PDF book into a Docusaurus site"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core: PDF text-layer extraction, layout geometry, and the gate harness.
# Chapter *structure* by default also comes from the dual extractors below
# (marker + docling), which is why they're in the default group rather than
# an opt-in extra -- see ARCHITECTURE.md, "The central design decision".
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "torch>=2.2",
    "marker-pdf>=1.2",
    "docling>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Install a single extractor backend (`uv sync --extra marker-only` or
# `--extra docling-only`) if you want to run `--only marker`/`--only docling`
# without pulling in the other. Skips the shared torch dependency's disk
# footprint accordingly where possible.
marker-only = ["torch>=2.2", "marker-pdf>=1.2"]
docling-only = ["docling>=2.0"]

[project.scripts]
bookery = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
